<h2 mat-dialog-title class="dialog-title-container">
  <mat-icon [class]="getIconClass()">{{ getIconName() }}</mat-icon>
  <span>{{ data.title }}</span>
</h2>

<mat-dialog-content class="dialog-content">
  <p class="message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <!-- Devuelve true al confirmar -->
  <button mat-flat-button color="primary" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmText || 'Aceptar' }}
  </button>
  <!-- Devuelve false al cancelar -->
  <button mat-button [mat-dialog-close]="false">
    {{ data.cancelText || 'Cancelar' }}
  </button>
</mat-dialog-actions>
