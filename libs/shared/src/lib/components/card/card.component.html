<mat-card class="enterprise-card" [style.border-left-color]="borderColor()">
  @if (title() || subtitle()) {
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
      <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
    </mat-card-header>
  }

  <mat-card-content class="content-body">
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
