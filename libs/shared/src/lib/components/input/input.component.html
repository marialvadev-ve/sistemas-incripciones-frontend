<mat-form-field appearance="outline" class="w-full">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    [readonly]="readonly()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</mat-form-field>
