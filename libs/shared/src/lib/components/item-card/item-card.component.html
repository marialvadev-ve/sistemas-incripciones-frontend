<div
  class="responsive-card"
  (dblclick)="rowDblClick.emit(item)"
  tabindex="0"
  role="region"
  aria-label="Detalle del registro"
>
  <div
    class="card-left"
    tabindex="0"
    role="button"
    aria-label="Eliminar registro"
    (click)="onDelete($event)"
    (keyup.enter)="onDelete($event)"
  >
    <div class="circle-avatar" [style.background-color]="hasLogo() ? 'transparent' : getAvatarColor()">
      @if (hasLogo()) {
        <img [src]="getLogo()" alt="Logo institucional" class="avatar-img" />
      } @else {
        {{ getSiglas() }}
      }
    </div>
    <span class="card-siglas">{{ getDisplaySiglas() }}</span>
  </div>

  <div class="card-right">
    <h3 class="card-title">{{ getNombreCard() }}</h3>
    @for (col of columns.slice(1); track col.key) {
      <div class="card-detail">
        <span class="detail-label">{{ col.label }}:</span> {{ formatCell(col) }}
      </div>
    }
  </div>
</div>
