<div class="InputNumber-container">
  <mat-form-field class="InputNumber w-full" [class.onClassErrorInput]="onClassErrorInput()" appearance="outline">
    <mat-label>{{ label() }}</mat-label>

    <input
      matInput
      type="number"
      class="InputNumber-input"
      [class.right]="isRight()"
      [matTooltip]="toolTipValue()"
      [value]="value()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [placeholder]="placeholder()"
      autocomplete="off"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    @if (hintText()) {
      <mat-hint>{{ hintText() }}</mat-hint>
    }
  </mat-form-field>
</div>
